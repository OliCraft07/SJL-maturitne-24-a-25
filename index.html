<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Predmety a nástroje</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: controls on top, then a grid of "part cards". Each subject is a labelled component (its code in mono, like a part number) with its sources listed as rows. */
:root {
  --bg: #eef0f5;
  --surface: #ffffff;
  --ink: #141a2c;
  --muted: #586079;
  --line: #d4d9e6;
  --accent: #2f4bd8;
  --accent-ink: #ffffff;
  --hl: #f4c63d;
  --hl-ink: #2b2200;
  --chip: #e4e8f3;
  --c-tool: #2f4bd8;
  --c-book: #0f8a6a;
  --c-play: #c2306b;
  --c-video: #c2410c;
  --c-course: #7a3fd0;
  --c-teacher: #8a6d00;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d111c; --surface: #151b2b; --ink: #e8ebf5; --muted: #98a1bd; --line: #283049;
    --accent: #8ea0ff; --accent-ink: #0d1230; --chip: #1e2639;
    --c-tool: #8ea0ff; --c-book: #4cc9a4; --c-play: #f27aa8; --c-video: #f59a62; --c-course: #b99aff; --c-teacher: #e0c04a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d111c; --surface: #151b2b; --ink: #e8ebf5; --muted: #98a1bd; --line: #283049;
  --accent: #8ea0ff; --accent-ink: #0d1230; --chip: #1e2639;
  --c-tool: #8ea0ff; --c-book: #4cc9a4; --c-play: #f27aa8; --c-video: #f59a62; --c-course: #b99aff; --c-teacher: #e0c04a;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.5 var(--font-body);
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

header { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
h1 {
  margin: 0;
  font: 700 clamp(2.1rem, 6vw, 3.4rem)/1.02 var(--font-display);
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.lede { margin: 0; color: var(--muted); max-width: 60ch; font-size: 1.02rem; }

.controls {
  display: flex; flex-direction: column; gap: 14px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 16px;
}
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; min-width: 0; }
.field { flex: 1 1 240px; min-width: 0; position: relative; }
.field label, .lbl {
  font: 500 11px/1 var(--font-mono);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.field label { position: absolute; left: 12px; top: 8px; pointer-events: none; }
.field input {
  width: 100%;
  font: 400 15px/1.2 var(--font-body);
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 24px 12px 8px;
}
.field input::placeholder { color: var(--muted); opacity: 0.8; }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--bg); }
.seg button {
  font: 500 13px/1 var(--font-body);
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 12px 14px;
  cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

.chips { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip {
  display: inline-flex; align-items: center; gap: 8px;
  font: 500 13px/1 var(--font-body);
  color: var(--ink);
  background: var(--chip);
  border: 1px solid transparent;
  border-radius: 999px;
  padding: 8px 12px;
  cursor: pointer;
}
.chip .dot { width: 8px; height: 8px; border-radius: 2px; background: var(--dot, var(--accent)); }
.chip .n { font: 500 11px/1 var(--font-mono); color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--surface); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.chip:hover, .seg button:hover { filter: brightness(0.97); }

.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
#status { margin: 0; font: 500 12px/1.4 var(--font-mono); color: var(--muted); letter-spacing: 0.02em; }
.link-btn {
  font: 500 13px/1 var(--font-body);
  color: var(--accent);
  background: none; border: 0; padding: 6px 2px; cursor: pointer;
  text-decoration: underline; text-underline-offset: 3px;
}

button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.list {
  list-style: none; margin: 0; padding: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 6px;
}
.item {
  display: grid;
  grid-template-columns: 150px minmax(0, 1fr);
  gap: 8px 24px;
  padding: 18px 20px;
  border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.id { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.code { font: 700 1.25rem/1.15 var(--font-mono); letter-spacing: 0.02em; overflow-wrap: anywhere; }
.grp { font: 500 10px/1 var(--font-mono); letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.body { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.item h2 { margin: 0; font: 500 1.1rem/1.25 var(--font-display); text-wrap: balance; }

.res { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.res li { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.tag {
  flex: 0 0 auto;
  min-width: 92px;
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 10px/1 var(--font-mono);
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.tag i { width: 8px; height: 8px; border-radius: 2px; background: var(--dot); display: inline-block; }
.name { min-width: 0; overflow-wrap: anywhere; font-weight: 500; }
.name a { color: var(--accent); text-underline-offset: 3px; }
.res li.hit .name { background: var(--hl); color: var(--hl-ink); padding: 1px 5px; border-radius: 2px; }
.res li.hit .name a { color: var(--hl-ink); }

.lines { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.lines dt { font: 500 11px/1.6 var(--font-mono); color: var(--muted); }
.lines dd { margin: 0; min-width: 0; }
.note { margin: 0; color: var(--muted); font-size: 14px; padding-top: 10px; border-top: 1px dashed var(--line); }
.note.alone { border-top: 0; padding-top: 0; }
.none { margin: 0; color: var(--muted); font-style: italic; font-size: 14px; }

.empty {
  text-align: center; padding: 40px 16px;
  background: var(--surface); border: 1px dashed var(--line); border-radius: 6px;
  display: flex; flex-direction: column; gap: 10px; align-items: center;
}
.empty p { margin: 0; }
.empty strong { font: 500 1.1rem/1.3 var(--font-display); }

@media (max-width: 640px) {
  .item { grid-template-columns: minmax(0, 1fr); padding: 16px; }
  .id { flex-direction: row; align-items: baseline; justify-content: space-between; gap: 12px; }
}
@media (max-width: 480px) {
  .tag { min-width: 84px; }
  .seg { width: 100%; }
  .seg button { flex: 1; padding-inline: 8px; }
}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Predmety a nástroje</h1>
    <p class="lede">Čo používame na hodinách: programy, učebnice, videá a materiály od učiteľov. Hľadaj podľa predmetu alebo filtruj podľa typu zdroja.</p>
  </header>

  <section class="controls" aria-label="Filtre">
    <div class="row">
      <div class="field">
        <label for="q">Hľadať</label>
        <input id="q" type="search" placeholder="napr. Kahoot, C#, PHP" autocomplete="off">
      </div>
      <div class="seg" role="group" aria-label="Skupina predmetov">
        <button type="button" data-g="all" aria-pressed="true">Všetky</button>
        <button type="button" data-g="odb" aria-pressed="false">Odborné</button>
        <button type="button" data-g="vse" aria-pressed="false">Všeobecné</button>
      </div>
    </div>
    <div class="row">
      <span class="lbl">Zdroj</span>
      <div class="chips" id="chips" role="group" aria-label="Typ zdroja"></div>
    </div>
  </section>

  <div class="bar">
    <p id="status" aria-live="polite"></p>
    <button type="button" class="link-btn" id="reset" hidden>Zrušiť filtre</button>
  </div>

  <ul class="list" id="grid"></ul>

  <div class="empty" id="empty" hidden>
    <strong>Nič sa nenašlo</strong>
    <p>Skús iné slovo alebo zruš niektorý filter.</p>
    <button type="button" class="link-btn" id="reset2">Zrušiť filtre</button>
  </div>
</div>

<script>
(function () {
  var TYPES = {
    tool:    { label: 'Nástroj',      color: 'var(--c-tool)' },
    book:    { label: 'Učebnica',     color: 'var(--c-book)' },
    play:    { label: 'Interaktívne', color: 'var(--c-play)' },
    video:   { label: 'Video',        color: 'var(--c-video)' },
    course:  { label: 'Kurz',         color: 'var(--c-course)' },
    teacher: { label: 'Od učiteľa',   color: 'var(--c-teacher)' }
  };
  var GROUPS = { odb: 'Odborný', vse: 'Všeobecný' };

  var DATA = [
    { code: 'PRO', title: 'Programovanie', g: 'odb',
      res: [{ n: 'Visual Studio 2022', t: 'tool' }],
      lines: [['1. – 2. ročník', 'C++ · konzolová aplikácia'], ['3. – 4. ročník', 'C# · konzolová aplikácia, Windows Forms']] },
    { code: 'DAA', title: 'Databázy', g: 'odb',
      res: [{ n: 'XAMPP (phpMyAdmin)', t: 'tool' }, { n: 'Visual Studio 2022', t: 'tool' }],
      note: 'Návrh databázy, jej úprava a použitie v aplikáciách.' },
    { code: 'WET', title: 'Tvorba webových stránok', g: 'odb',
      res: [{ n: 'VS Code', t: 'tool' }],
      note: 'HTML a CSS.' },
    { code: 'ROO', title: 'Dynamické webové aplikácie', g: 'odb',
      res: [{ n: 'VS Code', t: 'tool' }],
      note: 'Práca s databázou: PHP, SQL a trochu JavaScriptu.' },
    { code: 'SOA', title: 'Arduino a obvody', g: 'odb',
      res: [{ n: 'Arduino', t: 'tool' }],
      note: 'Jednoduché zapájanie obvodov s ľahkým programovaním v C++.' },
    { code: 'FIG a EKN', title: '', g: 'vse',
      res: [{ n: 'jaslovensko.sk', t: 'book', u: 'https://jaslovensko.sk' }],
      note: 'Online učebnica.' },
    { code: 'NEJ', title: 'Nemecký jazyk', g: 'vse',
      res: [{ n: 'Učebnica', t: 'book' }, { n: 'mcourser.cz (online verzia)', t: 'book', u: 'https://mcourser.cz' }] },
    { code: 'MAT', title: 'Matematika', g: 'vse',
      res: [{ n: 'desmos.com', t: 'play', u: 'https://www.desmos.com' }],
      note: 'Zobrazovanie grafov.' },
    { code: 'ANJ', title: 'Anglický jazyk', g: 'vse',
      res: [{ n: 'kahoot.com', t: 'play', u: 'https://kahoot.com' }],
      note: 'Interaktívne kvízy.' },
    { code: 'SJL', title: 'Slovenský jazyk a literatúra', g: 'vse',
      res: [{ n: 'Baštrng (YouTube)', t: 'video' }, { n: 'Schooltag (YouTube)', t: 'video' }] },
    { code: 'FYZ', title: 'Fyzika', g: 'vse',
      res: [{ n: 'Online učebnica', t: 'book' }] },
    { code: 'ELS', title: '', g: 'odb',
      res: [{ n: 'Prezentácie od učiteľa', t: 'teacher' }, { n: 'Vzdelávacie videá od učiteľa', t: 'teacher' }] },
    { code: 'PAY', title: '', g: 'odb',
      res: [{ n: 'Kurz v Netacad', t: 'course', u: 'https://www.netacad.com' }, { n: 'PDF materiály od učiteľa', t: 'teacher' }, { n: 'Videá z YouTube', t: 'video' }] },
    { code: 'SIE a PRAX', title: 'Počítačové siete v praxi', g: 'odb',
      res: [{ n: 'Kurzy v Netacad', t: 'course', u: 'https://www.netacad.com' }, { n: 'Packet Tracer', t: 'tool' }],
      note: 'Vytváranie a nastavovanie sietí v simulátore, praktické zadania a úlohy z kurzov.' },
    { code: 'OBN', title: 'Občianska náuka', g: 'vse',
      res: [{ n: 'Prezentácie od učiteľa', t: 'teacher' }] }
  ];

  var state = { q: '', g: 'all', types: {} };

  var $ = function (id) { return document.getElementById(id); };
  var grid = $('grid'), chipsEl = $('chips'), statusEl = $('status'), emptyEl = $('empty');
  var resetBtn = $('reset'), qInput = $('q');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function norm(s) {
    return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function activeTypes() { return Object.keys(state.types).filter(function (k) { return state.types[k]; }); }
  function anyFilter() { return state.q.trim() !== '' || state.g !== 'all' || activeTypes().length > 0; }

  function hay(s) {
    var parts = [s.code, s.title, s.note || '', s.none || ''];
    (s.lines || []).forEach(function (l) { parts.push(l[0], l[1]); });
    s.res.forEach(function (r) { parts.push(r.n, TYPES[r.t].label); });
    return norm(parts.join(' '));
  }
  DATA.forEach(function (s) { s._hay = hay(s); });

  function passes(s) {
    if (state.g !== 'all' && s.g !== state.g) return false;
    var at = activeTypes();
    if (at.length && !s.res.some(function (r) { return at.indexOf(r.t) !== -1; })) return false;
    var q = norm(state.q.trim());
    if (q && s._hay.indexOf(q) === -1) return false;
    return true;
  }

  function isHit(r) {
    var at = activeTypes();
    if (at.length && at.indexOf(r.t) !== -1) return true;
    var q = norm(state.q.trim());
    return q !== '' && norm(r.n).indexOf(q) !== -1;
  }

  function cardHtml(s) {
    var h = '<li class="item"><div class="id"><span class="code">' + esc(s.code) + '</span>' +
            '<span class="grp">' + GROUPS[s.g] + '</span></div><div class="body">';
    if (s.title) h += '<h2>' + esc(s.title) + '</h2>';
    if (s.res.length) {
      h += '<ul class="res">';
      s.res.forEach(function (r) {
        var t = TYPES[r.t];
        var name = r.u
          ? '<a href="' + esc(r.u) + '" target="_blank" rel="noopener noreferrer">' + esc(r.n) + ' ↗</a>'
          : esc(r.n);
        h += '<li' + (isHit(r) ? ' class="hit"' : '') + '><span class="tag" style="--dot:' + t.color + '"><i></i>' +
             esc(t.label) + '</span><span class="name">' + name + '</span></li>';
      });
      h += '</ul>';
    }
    if (s.lines) {
      h += '<dl class="lines">';
      s.lines.forEach(function (l) { h += '<dt>' + esc(l[0]) + '</dt><dd>' + esc(l[1]) + '</dd>'; });
      h += '</dl>';
    }
    if (s.note) h += '<p class="note">' + esc(s.note) + '</p>';
    if (s.none) h += '<p class="none">' + esc(s.none) + '</p>';
    return h + '</div></li>';
  }

  function buildChips() {
    var h = '';
    Object.keys(TYPES).forEach(function (k) {
      var n = DATA.filter(function (s) { return s.res.some(function (r) { return r.t === k; }); }).length;
      h += '<button type="button" class="chip" data-t="' + k + '" aria-pressed="false" style="--dot:' + TYPES[k].color + '">' +
           '<span class="dot"></span>' + TYPES[k].label + '<span class="n">' + n + '</span></button>';
    });
    chipsEl.innerHTML = h;
  }

  function render() {
    var shown = DATA.filter(passes);
    grid.innerHTML = shown.map(cardHtml).join('');
    grid.hidden = shown.length === 0;
    emptyEl.hidden = shown.length !== 0;
    statusEl.textContent = 'Zobrazené ' + shown.length + ' z ' + DATA.length + ' záznamov';
    resetBtn.hidden = !anyFilter();
    Array.prototype.forEach.call(chipsEl.children, function (b) {
      b.setAttribute('aria-pressed', state.types[b.getAttribute('data-t')] ? 'true' : 'false');
    });
    Array.prototype.forEach.call(document.querySelectorAll('.seg button'), function (b) {
      b.setAttribute('aria-pressed', b.getAttribute('data-g') === state.g ? 'true' : 'false');
    });
  }

  function reset() {
    state = { q: '', g: 'all', types: {} };
    qInput.value = '';
    render();
  }

  chipsEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-t]');
    if (!b) return;
    var k = b.getAttribute('data-t');
    state.types[k] = !state.types[k];
    render();
  });
  document.querySelector('.seg').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-g]');
    if (!b) return;
    state.g = b.getAttribute('data-g');
    render();
  });
  qInput.addEventListener('input', function () { state.q = qInput.value; render(); });
  resetBtn.addEventListener('click', reset);
  $('reset2').addEventListener('click', reset);

  buildChips();
  render();
})();
</script>
</body>
</html>
